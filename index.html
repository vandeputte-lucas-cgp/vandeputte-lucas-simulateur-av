<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Simulateur AV">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Simulateur Assurance Vie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E9EDF2; --ink:#121B2E; --ink-2:#4A5568; --ink-3:#7A8699;
  --line:#D6DCE5; --teal:#16786A; --teal-soft:#CFE8E2; --amber:#B06E1B; --amber-soft:#F4E3CA;
  --red:#AE4639; --red-soft:#F3DCD7; --slate:#8796A0; --focus:#1D2C7A;
  --navy:#0E1A5C; --navy-ink:#FFFFFF; --navy-soft:#E3E7F5; --row1:#DDE3EB; --row2:#CAD2DD; --rowt:#E8ECF1;
  --sans:"Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1018; --surface:#121925; --surface-2:#1A2331; --ink:#E4E9F1; --ink-2:#A3AEBF; --ink-3:#6F7B8E;
    --line:#263142; --teal:#52B9A7; --teal-soft:#153630; --amber:#E2A65A; --amber-soft:#3A2B17;
    --red:#E58072; --red-soft:#3B201C; --slate:#6F7B8E; --focus:#8EA0F0;
    --navy:#24348C; --navy-ink:#FFFFFF; --navy-soft:#1C2548; --row1:#1B2533; --row2:#222E3F; --rowt:#161F2B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1018; --surface:#121925; --surface-2:#1A2331; --ink:#E4E9F1; --ink-2:#A3AEBF; --ink-3:#6F7B8E;
  --line:#263142; --teal:#52B9A7; --teal-soft:#153630; --amber:#E2A65A; --amber-soft:#3A2B17;
  --red:#E58072; --red-soft:#3B201C; --slate:#6F7B8E; --focus:#8EA0F0;
  --navy:#24348C; --navy-ink:#FFFFFF; --navy-soft:#1C2548; --row1:#1B2533; --row2:#222E3F; --rowt:#161F2B;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:22px 48px}
h1,h2,h3{text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0}
.muted{color:var(--ink-3)}

/* top bar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.brand h1{font-size:clamp(22px,2.6vw,28px);line-height:1.1;letter-spacing:-.02em;margin:2px 0 0;font-weight:800}
.brand h1 em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:0;color:var(--navy)}
:root:not([data-theme="light"]) .brand h1 em{color:var(--focus)}
:root[data-theme="light"] .brand h1 em{color:var(--navy)}
.clientbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.clientbar select{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px 10px;max-width:260px}
.search{position:relative;width:240px;max-width:100%}
.search .inp input{font-weight:500}
.results-pop{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(0 0 0 / .15);padding:4px;max-height:320px;overflow:auto}
.results-pop button{font:inherit;display:grid;gap:1px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.results-pop button:hover,.results-pop button.act{background:var(--surface-2)}
.results-pop button b{font-weight:700}
.results-pop button span{font-size:12px;color:var(--ink-3)}
.results-pop mark{background:var(--amber-soft);color:inherit;border-radius:2px}
.results-pop .none{padding:10px;font-size:13px;color:var(--ink-3)}
.status{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;min-width:0}
.status i{width:7px;height:7px;border-radius:50%;background:var(--slate);display:inline-block}
.status.ok i{background:var(--teal)} .status.busy i{background:var(--amber)} .status.err i{background:var(--red)}

/* buttons & inputs */
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.12);background:var(--navy)}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.link{border:0;background:none;color:var(--focus);padding:0;font-size:13px}
.btn.link:hover{text-decoration:underline;background:none}
.btn.sm{padding:5px 9px;font-size:12.5px}
.field{display:grid;gap:5px;min-width:0}
.field > label,.lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);transition:border-color .15s}
.inp:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.inp input{border:0;background:transparent;padding:8px 4px 8px 10px;width:100%;min-width:0;font:inherit;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;outline:none}
.inp input::placeholder{color:var(--ink-3);font-weight:500}
.inp .u{padding-right:10px;color:var(--ink-3);font-size:13px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2);gap:2px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .15s,color .15s}
.seg input:checked + label{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.seg input:focus-visible + label{outline:2px solid var(--focus);outline-offset:1px}
.seg input:disabled + label{opacity:.45;cursor:not-allowed}
.note{font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.45}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--ink);font-weight:500}
.switch input{appearance:none;width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.switch input:checked{background:var(--teal)}
.switch input:checked::after{transform:translateX(16px)}
.switch input:disabled{opacity:.45;cursor:not-allowed}
.switch input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;align-items:end}
.hide{display:none!important}
[hidden]{display:none!important}

/* client card */
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;display:grid;gap:14px}
.ccard-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.ccard-h .nm{font-size:20px;font-weight:800;letter-spacing:-.015em}
.cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:14px 18px;align-items:start}
@media (max-width:1000px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.person{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.person .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.agehint{font-size:12.5px;color:var(--teal);font-weight:600}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{font:inherit;font-size:14px;font-weight:600;color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--navy)}
:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{border-bottom-color:var(--focus)}
:root[data-theme="light"] .tabs button[aria-selected="true"]{border-bottom-color:var(--navy)}
.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.tabs .cnt{font-size:11.5px;background:var(--surface-2);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--ink-3)}

/* levers strip */
.levers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.lcard{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:4px;color:var(--ink)}
.lcard:hover{border-color:var(--ink-3)}
.lcard[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
:root:not([data-theme="light"]) .lcard[aria-pressed="true"]{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
:root[data-theme="light"] .lcard[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.lcard:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lcard .t{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lcard .pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 6px;background:var(--navy-soft);color:var(--ink-2);flex:none}
.lcard .f{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.lcard .f b{color:var(--ink)}
.addbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:20px}
.addbar .lbl{margin-right:4px}

/* simulator */
.app{display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:920px){.app{grid-template-columns:minmax(0,1fr)}}
form.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 18px 18px}
.grp{display:grid;gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.results{display:grid;gap:22px;min-width:0}
.hero{padding:4px 2px 0;display:grid;gap:10px}
.big{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.big .n{font-size:clamp(44px,6.6vw,72px);font-weight:800;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.big .u{font-size:17px;color:var(--ink-2);font-weight:600}
.netline{font-size:15px;color:var(--ink-2);margin:0}
.netline b{color:var(--teal);font-weight:700}
.thesis{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2vw,21px);line-height:1.4;margin:2px 0 0;max-width:62ch}
.phases{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-top:6px;font-size:12.5px;font-weight:600}
.phases div{display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;min-width:0}
.ph-e{background:var(--teal-soft);color:var(--teal)} .ph-r{background:var(--amber-soft);color:var(--amber)} .ph-x{background:var(--surface-2);color:var(--ink-3)}
.alert{border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--amber-soft)} .alert.err{background:var(--red-soft)} .alert.ok{background:var(--teal-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
.alert.warn .dot{background:var(--amber)} .alert.err .dot{background:var(--red)} .alert.ok .dot{background:var(--teal)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;margin-bottom:12px}
.card-h h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.sw.e{background:var(--teal)} .sw.r{background:var(--amber)}
.sw.v{height:0;border-top:2px dashed var(--ink-2);width:16px;border-radius:0}
.sw.z{height:0;border-top:2px dotted var(--slate);width:16px;border-radius:0}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink-3);font-family:var(--sans);font-size:11px;font-variant-numeric:tabular-nums}
.grid-l{stroke:var(--line);stroke-width:1}
.a-e{fill:var(--teal-soft)} .a-r{fill:var(--amber-soft)}
.l-e{stroke:var(--teal);stroke-width:2.2;fill:none} .l-r{stroke:var(--amber);stroke-width:2.2;fill:none}
.l-v{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.l-z{stroke:var(--slate);stroke-width:1.6;stroke-dasharray:2 3;fill:none}
.retl{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.chart text.retlab{fill:var(--ink);font-weight:700}
.chart text.rettick{fill:var(--ink);font-weight:700}
.hov{stroke:var(--ink);stroke-width:1;opacity:.35}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px;align-content:start}
.kpi:last-child{border-right:0}
.kpi .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(2){border-right:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.fees-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px}
@media (max-width:760px){.fees-grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin:10px 0 12px}
.f1{background:var(--red)} .f2{background:color-mix(in srgb,var(--red) 62%,var(--surface))} .f3{background:color-mix(in srgb,var(--red) 32%,var(--surface))}
.flist{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px}
.flist li{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.flist li span:first-child{display:inline-flex;gap:8px;align-items:center;color:var(--ink-2)}
.flist li b{font-variant-numeric:tabular-nums}
.flist li.tot{border-top:1px solid var(--line);padding-top:8px}
.flist li.tot span:first-child{color:var(--ink);font-weight:700}
.feetotal{font-size:30px;font-weight:800;letter-spacing:-.025em;color:var(--red);font-variant-numeric:tabular-nums;line-height:1.1}
.cmp{display:grid;gap:12px}
.cmp .c{border-left:3px solid var(--line);padding-left:12px}
.cmp .k{font-size:12.5px;color:var(--ink-2)} .cmp .v{font-size:15px;font-variant-numeric:tabular-nums} .cmp .d{color:var(--red);font-weight:700}
.rate-note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:9px 12px}
details.tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.tbl summary{cursor:pointer;padding:15px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px;list-style:none}
details.tbl summary::-webkit-details-marker{display:none}
details.tbl summary::after{content:"+";font-size:20px;color:var(--ink-3);font-weight:400;line-height:1}
details.tbl[open] summary::after{content:"–"}
.tbl-scroll{overflow-x:auto;border-top:1px solid var(--line)}
table.yr{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.yr th,table.yr td{padding:7px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.yr th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:600;background:var(--surface)}
table.yr td:first-child,table.yr th:first-child{text-align:left}
tr.r-e td:nth-child(2){color:var(--teal);font-weight:600} tr.r-r td:nth-child(2){color:var(--amber);font-weight:600} tr.r-m td:nth-child(2){color:var(--ink-2);font-weight:600}
td.neg{color:var(--red)} td.strong{font-weight:700}
.disc{font-size:12.5px;color:var(--ink-3);line-height:1.5;margin:0;max-width:90ch}

/* slide tables (solution chiffrée / trois solutions) */
.deck{display:grid;gap:22px}
.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,36px);display:grid;gap:22px}
.slide h2{text-align:center;font-size:clamp(22px,2.6vw,30px);font-weight:500;margin:0;color:var(--ink);letter-spacing:-.01em}
.stw{overflow-x:auto}
table.st{border-collapse:separate;border-spacing:2px;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
table.st th{background:var(--navy);color:var(--navy-ink);font-weight:700;font-size:15px;padding:14px 12px;text-align:center;line-height:1.25}
table.st td{padding:14px 12px;text-align:center;font-size:17px;line-height:1.3}
table.st tbody tr:nth-child(odd) td{background:var(--row2)}
table.st tbody tr:nth-child(even) td{background:var(--row1)}
table.st tr.total td{background:var(--rowt)!important;font-weight:700}
table.st .sub{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
table.st.tri td{font-size:clamp(20px,2.8vw,34px);font-weight:500;padding:18px 12px}
table.st.tri td.idx{font-size:clamp(28px,3.6vw,46px);font-weight:800;color:var(--navy);width:10%}
:root:not([data-theme="light"]) table.st.tri td.idx{color:var(--focus)}
:root[data-theme="light"] table.st.tri td.idx{color:var(--navy)}
.args{background:var(--navy);color:var(--navy-ink);border-radius:4px;padding:16px 20px;display:grid;gap:4px;justify-items:center;text-align:center;font-size:16px}
.args div::before{content:"•  "}
.args-edit{display:grid;gap:6px}
.args-edit textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px;min-height:86px;resize:vertical}
.args-edit textarea:focus{outline:2px solid var(--focus);outline-offset:1px}
.params{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.params .field{width:170px}
.matrix-w{overflow-x:auto}

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const fE=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const eur=v=>fE.format(Math.round(v||0))+' €';
const eurm=v=>fE.format(Math.round(v||0))+' €/mois';
const pct=(v,d=2)=>(+v).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})+' %';
const kEur=v=>{const a=Math.abs(v);if(a>=1e6)return (v/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M€';if(a>=1e3)return fE.format(v/1e3)+' k€';return fE.format(v)+' €';};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numv=v=>{const x=parseFloat(String(v??'').replace(/[\s\u00a0\u202f€%]/g,'').replace(',','.'));return isFinite(x)?x:0;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const yrs=n=>n+(n>1?' ans':' an');
function ageTxtM(m){m=Math.round(m);const y=Math.floor(m/12),r=m-y*12;return r?`${y} ans et ${r} mois`:`${y} ans`;}

/* ================= model ================= */
const DEF_ARGS='Protection familiale : par le choix de la clause bénéficiaire et les capitaux hors succession\nMeilleure rentabilité de votre épargne mensuelle et de votre épargne déjà constituée\nDisponibilité des fonds en cas de besoin';
function newSim(produit,mv,over){
  return Object.assign({id:uid(),kind:'sim',produit,label:'',mv,capital:mv==='mensuel'?0:10000,mensuel:mv==='capital'?0:200,idxOn:false,idx:2,
    mr:'auto',fixe:500,r:2,rt:'net',fg:1.2,fv:1.5,fisc:false,ps:17.2},over||{});
}
/* ===== SCPI : mémo « tableau simplifié », lu tel quel =====
   [montant du projet, apport, participation 15 ans, revenus 15 ans, participation 20 ans, revenus 20 ans, participation 25 ans, revenus 25 ans] */
const SCPI_TABLE=[
[33600,3600,107,181,66,186,null,null],[40000,4000,130,216,80,221,51,227],[50000,5000,162,269,100,276,64,283],
[60000,6000,194,194,120,331,77,340],[70000,7000,227,377,140,387,90,396],[80000,8000,259,431,160,442,103,453],
[90000,9000,291,485,180,497,115,510],[100000,10000,534,539,200,552,128,566],[110000,11000,356,593,220,608,141,623],
[120000,12000,389,647,240,663,154,680],[130000,13000,421,700,260,718,167,736],[140000,14000,454,754,280,773,179,793],
[150000,15000,486,808,300,829,192,850],[160000,16000,518,518,320,884,205,906],[170000,17000,551,916,340,939,218,963],
[180000,18000,583,970,360,994,231,1020],[190000,19000,616,1024,380,1050,243,1076],[200000,20000,648,1078,400,1105,256,1133],
[210000,21000,680,1132,420,1160,269,1189],[220000,22000,713,1185,440,1215,282,1246],[230000,23000,745,1239,460,1271,295,1303],
[240000,24000,778,1293,480,1326,308,1359],[250000,25000,810,1347,500,1381,320,1416],[260000,26000,842,1401,520,1436,333,1473],
[270000,27000,875,1455,540,1492,346,1529],[280000,28000,907,1509,560,1547,359,1586],[290000,29000,940,1563,580,1602,372,1643],
[300000,30000,972,1617,600,1657,384,1699]];
const SCPI_COL={15:2,20:4,25:6};
function scpiAt(P,d){
  const k=SCPI_COL[d]||6;P=+P||0;if(P<=0)return null;
  const rows=SCPI_TABLE.filter(r=>r[k]!=null);
  const ex=rows.find(r=>r[0]===P);
  if(ex)return {projet:P,apport:ex[1],part:ex[k],rev:ex[k+1],interp:null};
  let lo=null,hi=null;rows.forEach(r=>{if(r[0]<P)lo=r;if(r[0]>P&&!hi)hi=r;});
  let part,rev,how;
  if(lo&&hi){const t=(P-lo[0])/(hi[0]-lo[0]);part=lo[k]+t*(hi[k]-lo[k]);rev=lo[k+1]+t*(hi[k+1]-lo[k+1]);how=`entre ${fE.format(lo[0])} € et ${fE.format(hi[0])} €`;}
  else{const r=lo||hi;part=r[k]*P/r[0];rev=r[k+1]*P/r[0];how=`au prorata de la ligne ${fE.format(r[0])} €`;}
  return {projet:P,apport:Math.round(P*0.1),part:Math.round(part),rev:Math.round(rev),interp:how};
}
function scpiLook(L){return scpiAt(L.projet,+L.duree||25);}
function scpiRet(L,d){const r=+L['ret'+d];if(r>0)return r;const c=+L['cap'+d];return c>0?Math.floor(c/1000)*1000:0;}
/* ===== Impôt sur le revenu 2026 (revenus 2025) et PER ===== */
const IR_BAREME=[[11600,0],[29579,.11],[84577,.30],[181917,.41],[Infinity,.45]];
const PASS_2026=48060;
function irParPart(q){let t=0,prev=0;for(const [lim,r] of IR_BAREME){if(q>prev)t+=(Math.min(q,lim)-prev)*r;prev=lim;}return t;}
function tmiOf(q){let prev=0;for(const [lim,r] of IR_BAREME){if(q<=lim)return r;prev=lim;}return .45;}
function impot(R,parts,couple){
  R=Math.max(0,R);parts=Math.max(1,+parts||1);const base=couple?2:1;const P=Math.max(parts,base);
  const t1=P*irParPart(R/P),t0=base*irParPart(R/base);
  let T=Math.max(t1,t0-1807*(P-base)*2);
  const [lim,f]=couple?[3277,1483]:[1982,897];
  if(T<lim)T=Math.max(0,T-(f-0.4525*T));
  return Math.round(T);
}
function fiscOf(c){return c.fisc||(c.fisc={rev:'',parts:c.profil==='couple'?2:1,plafond:'',statut:'sal',benef:''});}
function perAnnual(L){return (L.mv==='capital'?0:(+L.mensuel||0)*12)+(L.mv==='mensuel'?0:(+L.capital||0));}
function perFiscal(c,annual){
  const f=fiscOf(c);const R=+f.rev||0;if(!R)return null;
  const couple=c.profil==='couple',parts=Math.max(+f.parts||1,couple?2:1);
  const q=R/parts,tmi=tmiOf(q);
  const avant=impot(R,parts,couple),apres=impot(R-annual,parts,couple),eco=avant-apres;
  const utile=tmi>=.30?Math.round((q-29579)*parts):0;
  let plafPro=0;const B=+f.benef||0;
  if(f.statut==='tns'&&B>0){const P=PASS_2026,b=Math.min(B,8*P);plafPro=Math.round(Math.max(0.1*P,0.1*b+0.15*Math.max(0,b-P)));}
  const plafPerso=+f.plafond||0;const plaf=plafPerso+plafPro;
  const capa=+c.capacite>0?+c.capacite*12:0;
  const cands=[utile];if(plaf)cands.push(plaf);if(capa)cands.push(capa);
  const conseil=utile>0?Math.min(...cands):0;
  return {R,parts,tmi,avant,apres,eco,utile,plafPerso,plafPro,plaf,conseil,annual,over:plaf&&annual>plaf};
}
function perEcoTotal(c){
  const pers=c.levers.filter(L=>L.kind==='sim'&&L.produit==='PER');if(!pers.length)return null;
  const annual=pers.reduce((a,L)=>a+perAnnual(L),0);const cap=pers.some(L=>L.mv!=='mensuel'&&+L.capital>0);
  const r=perFiscal(c,annual);return r&&r.eco>0?{eco:r.eco,firstYear:cap}:null;
}
function newScpi(over){return Object.assign({id:uid(),kind:'scpi',label:'',duree:25,projet:50000},over||{});}
function newManual(over){return Object.assign({id:uid(),kind:'manuel',label:'Immobilier',mensuel:70,capital:4400,capRetraite:44000,revenu:283,debutAge:49,sub:''},over||{});}
function newClient(){
  return {id:uid(),nom:'Nouveau client',createdAt:Date.now(),updatedAt:Date.now(),profil:'seul',
    p1:{mode:'age',age:30,dob:'',sexe:'H'},p2:{mode:'age',age:30,dob:'',sexe:'F'},retraite:64,fin1:80,fin2:85,
    capacite:'',capitalMax:'',levers:[],tript:{auto:true,pct1:50,pct2:75,rows:null},args:DEF_ARGS};
}
function exampleClient(){
  const c=newClient();c.nom='Exemple · 24 ans';c.p1.age=24;c.retraite=55;
  c.levers=[newManual(),newSim('AV','capital',{capital:9600}),newSim('AV','mensuel',{mensuel:530})];
  return c;
}
function leverLabel(L){
  if(L.kind==='scpi')return (L.label&&L.label.trim())?L.label.trim():'SCPI';
  if(L.label&&L.label.trim())return L.label.trim();
  if(L.kind==='manuel')return 'Levier manuel';
  const p=L.produit==='PER'?'PER':'Assurance vie';
  return `${p} (${L.mv==='capital'?'Capital':L.mv==='mensuel'?'Epargne':'Capital + Epargne'})`;
}
const monthlyOf=L=>L.kind==='scpi'?((scpiLook(L)||{}).part||0):L.kind==='manuel'?(+L.mensuel||0):(L.mv==='capital'?0:(+L.mensuel||0));
const capitalOf=L=>L.kind==='scpi'?((scpiLook(L)||{}).apport||0):L.kind==='manuel'?(+L.capital||0):(L.mv==='mensuel'?0:(+L.capital||0));

/* ================= age / timeline ================= */
function ageM(p){
  if(p.mode==='dob'&&p.dob){const d=new Date(p.dob+'T00:00:00');if(!isNaN(d)){const t=new Date();let m=(t.getFullYear()-d.getFullYear())*12+(t.getMonth()-d.getMonth());if(t.getDate()<d.getDate())m--;return Math.max(0,m);}}
  return Math.max(0,Math.round(+p.age||0))*12;
}
function ctxOf(c){
  const couple=c.profil==='couple';
  const a1=ageM(c.p1),a2=couple?ageM(c.p2):null;
  const Ne=Math.round((+c.retraite||0)*12-a1);
  const e1=(+c.fin1||0)*12-a1,e2=couple?(+c.fin2||0)*12-a2:-1e9;
  const N=Math.round(Math.max(e1,e2));
  const errs=[];
  if(Ne<=0)errs.push('L\'âge de retraite doit être supérieur à l\'âge actuel.');
  if(N<=Ne)errs.push('L\'horizon des rachats doit se situer après la retraite.');
  if(N>1200)errs.push('Durée totale supérieure à 100 ans : vérifiez les âges.');
  return {couple,a1,a2,Ne,N,Nr:N-Ne,endAgeM:a1+N,errs,retraite:+c.retraite};
}

/* ================= engine (monthly) ================= */
function simulate(L,ctx,opt){
  opt=opt||{};const fees=opt.fees!==false;
  const {Ne,N,Nr,a1,a2,couple}=ctx;
  const fgIn=(+L.fg||0)/1200,fg=fees?fgIn:0,fv=fees?(+L.fv||0)/100:0;
  const base=Math.pow(1+(+L.r||0)/100,1/12);
  const gross=L.rt==='net'?base/(1-fgIn):base;
  const q=gross*(1-fg);
  const ov=opt.ov;
  const cap=ov?Math.max(0,+ov.capital||0):capitalOf(L);
  const men=ov?Math.max(0,+ov.mensuel||0):monthlyOf(L);
  let W=opt.W==null?null:opt.W;
  let E=0,primes=0,capR=0,deplete=null,paid=0,versCum=0;
  const T={vers:0,feeV:0,int:0,feeGe:0,feeGr:0,rach:0,gains:0};
  const Earr=new Float64Array(N+1),Varr=new Float64Array(N+1);
  const rows=[];let cur=null;
  for(let k=0;k<N;k++){
    const y=Math.floor(k/12);
    if(!cur||cur.y!==y){
      const s=y*12,e=s+12;
      cur={y,age:Math.floor((a1+s)/12),age2:couple?Math.floor((a2+s)/12):null,phase:e<=Ne?'e':(s>=Ne?'r':'m'),vers:0,feeV:0,int:0,feeG:0,rach:0,gains8:0,gainsPre:0,primesStart:primes,E:0};
      rows.push(cur);
    }
    if(k===Ne){capR=E;if(W==null)W=Nr>0?(Math.abs(q-1)<1e-12?E/Nr:E*Math.pow(q,Nr)*(q-1)/(Math.pow(q,Nr)-1)):0;}
    if(k<Ne){
      const D=(k===0?cap:0)+men*(L.idxOn?Math.pow(1+(+L.idx||0)/100,y):1);
      if(D>0){const f=D*fv;E+=D-f;primes+=D;versCum+=D;cur.vers+=D;cur.feeV+=f;T.vers+=D;T.feeV+=f;}
    }
    const it=E*(gross-1);E+=it;const fG=E*fg;E-=fG;
    cur.int+=it;cur.feeG+=fG;T.int+=it;if(k<Ne)T.feeGe+=fG;else T.feeGr+=fG;
    if(k>=Ne&&E>0&&W>0){
      const w=Math.min(W,E),share=Math.max(0,E-primes)/E,g=w*share;
      primes=Math.max(0,primes-(w-g));E-=w;if(E<0.01)E=0;paid++;
      cur.rach+=w;if(k>=96)cur.gains8+=g;else cur.gainsPre+=g;T.rach+=w;T.gains+=g;
      if(E===0&&deplete===null&&k<N-1)deplete=k+1;
    }
    cur.E=E;Earr[k+1]=E;Varr[k+1]=versCum;
  }
  return {rows,W:W||0,capR,final:E,deplete,paid,T,Earr,Varr,gross,q,fgIn,cap,men};
}
function taxRow(row,L,ctx){
  if(!(L.fisc&&L.produit!=='PER'))return {tot:0};
  const ab=ctx.couple?9200:4600,seuil=150000*(ctx.couple?2:1);
  const ratio=row.primesStart>0?Math.min(1,seuil/row.primesStart):1;
  const ir=Math.max(0,row.gains8-ab)*(0.075*ratio+0.128*(1-ratio))+row.gainsPre*0.128;
  const ps=(row.gains8+row.gainsPre)*(+L.ps||0)/100;
  return {ir,ps,tot:ir+ps};
}
/* unified output of one lever (optionally with triptyque overrides) */
function leverOut(L,ctx,ov){
  if(L.kind==='scpi'){const t=scpiLook(L)||{projet:+L.projet||0,apport:0,part:0,rev:0};return {mensuel:t.part,capital:t.apport,capR:t.projet,W:t.rev,debutAge:Math.floor(ctx.a1/12)+(+L.duree||0),scpi:t};}
  if(L.kind==='manuel')return {mensuel:+L.mensuel||0,capital:+L.capital||0,capR:+L.capRetraite||0,W:+L.revenu||0,debutAge:+L.debutAge||0};
  const useFixed=L.mr==='fixe'&&!ov;
  const r=simulate(L,ctx,{W:useFixed?(+L.fixe||0):null,ov});
  return {mensuel:r.men,capital:r.cap,capR:r.capR,W:r.W,debutAge:ctx.retraite,res:r};
}
function versText(o){
  if(o.capital>0&&o.mensuel>0)return `${eur(o.capital)} + ${eurm(o.mensuel)}`;
  if(o.capital>0)return eur(o.capital);
  if(o.mensuel>0)return eurm(o.mensuel);
  return '/';
}

/* ================= triptyque ================= */
function suggest(c){
  const Ls=c.levers,T=c.tript||{};
  const p1=(+T.pct1||50)/100,p2=(+T.pct2||75)/100;
  const C=+c.capacite>0?+c.capacite:Ls.reduce((a,L)=>a+monthlyOf(L),0);
  const K=+c.capitalMax>0?+c.capitalMax:Ls.reduce((a,L)=>a+capitalOf(L),0);
  const full=L=>({on:true,mensuel:monthlyOf(L),capital:capitalOf(L)});
  const off=L=>({on:false,mensuel:monthlyOf(L),capital:capitalOf(L)});
  const sims=Ls.filter(L=>L.kind==='sim');
  const monthlyL=Ls.filter(L=>monthlyOf(L)>0);
  const pureCap=Ls.filter(L=>monthlyOf(L)===0&&capitalOf(L)>0);
  const rows=[{},{},{}];
  Ls.forEach(L=>{rows[0][L.id]=off(L);rows[1][L.id]=off(L);rows[2][L.id]=full(L);});
  const mainM=sims.filter(L=>monthlyOf(L)>0).sort((a,b)=>(b.produit==='AV')-(a.produit==='AV')||monthlyOf(b)-monthlyOf(a))[0];
  if(mainM){
    rows[0][mainM.id]={on:true,mensuel:Math.round(p1*C),capital:0};
    if(pureCap.length){monthlyL.forEach(L=>rows[1][L.id]=full(L));}
    else{
      const others=monthlyL.filter(L=>L!==mainM);let s=0;
      others.forEach(L=>{rows[1][L.id]=full(L);s+=monthlyOf(L);});
      rows[1][mainM.id]={on:true,mensuel:Math.max(0,Math.round(p2*C-s)),capital:capitalOf(mainM)};
    }
  }else{
    const mainC=sims.filter(L=>capitalOf(L)>0).sort((a,b)=>capitalOf(b)-capitalOf(a))[0];
    if(mainC){rows[0][mainC.id]={on:true,mensuel:0,capital:Math.round(p1*K)};rows[1][mainC.id]={on:true,mensuel:0,capital:Math.round(p2*K)};}
  }
  return rows;
}
function triRows(c){
  const T=c.tript||(c.tript={auto:true,pct1:50,pct2:75,rows:null});
  let rows=T.auto||!T.rows?suggest(c):T.rows;
  // keep in sync with the lever list
  return rows.map((r,i)=>{const o={};c.levers.forEach(L=>{o[L.id]=r[L.id]||{on:i===2,mensuel:monthlyOf(L),capital:capitalOf(L)};});return o;});
}
function triCompute(c,ctx){
  const rows=triRows(c);
  return rows.map(r=>{
    let m=0,k=0,w=0;const cells={};
    c.levers.forEach(L=>{const it=r[L.id];if(!it||!it.on){cells[L.id]=null;return;}
      const full=L.kind!=='sim'||(Math.round(it.mensuel)===Math.round(monthlyOf(L))&&Math.round(it.capital)===Math.round(capitalOf(L)));
      const o=leverOut(L,ctx,full?null:{mensuel:it.mensuel,capital:it.capital});
      cells[L.id]=o;m+=o.mensuel;k+=o.capital;w+=o.W;});
    return {mensuel:m,capital:k,W:w,cells};
  });
}

const CFG=window.SIM_CONFIG||{};
const S={clients:{},cur:null,lever:null,tab:'leviers',sb:null,user:null,chan:null,dirty:new Set(),saving:false,again:false,t:null,online:true,base:{}};
const clone=o=>JSON.parse(JSON.stringify(o));
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
/* met à jour un dossier « sur place » : les écrans ouverts gardent la même référence, aucune saisie ne part dans le vide */
const isObj=o=>o&&typeof o==='object'&&!Array.isArray(o);
function syncInto(t,s){
  Object.keys(t).forEach(k=>{if(!(k in s))delete t[k];});
  Object.keys(s).forEach(k=>{
    const a=t[k],b=s[k];
    if(isObj(a)&&isObj(b))syncInto(a,b);
    else if(Array.isArray(a)&&Array.isArray(b)&&b.every(x=>x&&x.id)&&a.every(x=>x&&x.id)){
      const byId=Object.fromEntries(a.map(x=>[x.id,x]));const out=b.map(x=>byId[x.id]?syncInto(byId[x.id],x):clone(x));
      a.length=0;out.forEach(x=>a.push(x));
    }else t[k]=clone(b);
  });
  return t;
}
/* fusion à trois : ce qui a changé ici depuis la dernière version connue du serveur l'emporte, le reste vient du serveur */
function merge3(b,l,r){
  if(same(l,b))return clone(r);
  if(same(r,b)||r===undefined)return clone(l);
  if(Array.isArray(l)&&Array.isArray(r)&&l.every(x=>x&&x.id)&&r.every(x=>x&&x.id)){
    const bm=Object.fromEntries((Array.isArray(b)?b:[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
    const rm=Object.fromEntries(r.map(x=>[x.id,x]));const lm=Object.fromEntries(l.map(x=>[x.id,x]));
    const out=[];
    l.forEach(x=>{if(rm[x.id])out.push(merge3(bm[x.id],x,rm[x.id]));else if(!bm[x.id])out.push(clone(x));/* supprimé ailleurs */});
    r.forEach(x=>{if(!lm[x.id]&&!bm[x.id])out.push(clone(x));/* ajouté ailleurs */});
    return out;
  }
  if(l&&r&&typeof l==='object'&&typeof r==='object'&&!Array.isArray(l)&&!Array.isArray(r)){
    const o={};const bb=(b&&typeof b==='object')?b:{};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{const v=merge3(bb[k],l[k],r[k]);if(v!==undefined)o[k]=v;});
    return o;
  }
  return clone(l);
}
const cacheKey=()=>'av-cache-'+(S.user?S.user.id:'x');
function saveCache(){try{localStorage.setItem(cacheKey(),JSON.stringify(S.clients));}catch(e){}}
function loadCache(){try{const o=JSON.parse(localStorage.getItem(cacheKey())||'null');if(o&&typeof o==='object')S.clients=o;}catch(e){}}
function setStatus(kind,txt){const s=$('status');s.className='status '+(kind||'');s.lastElementChild.textContent=txt;}
function statusIdle(){if(S.online)setStatus('ok','Synchronisé');else setStatus('err','Hors ligne : enregistré sur cet appareil');}
function cur(){return S.clients[S.cur]||null;}
function touch(){
  const c=cur();if(!c)return;c.updatedAt=Date.now();S.dirty.add(c.id);saveCache();
  setStatus('busy','Enregistrement…');clearTimeout(S.t);S.t=setTimeout(flush,700);
}
async function flush(){
  if(S.saving){S.again=true;return;}
  S.saving=true;
  const ids=[...S.dirty];S.dirty.clear();let failed=false;
  for(const id of ids){
    let c=S.clients[id];if(!c)continue;
    const got=await S.sb.from('clients').select('data').eq('id',id);
    if(got.error){failed=true;S.dirty.add(id);continue;}
    const remote=got.data&&got.data[0]?got.data[0].data:null,base=S.base[id];
    if(remote&&!same(remote,base)&&!same(remote,c)){
      const mg=merge3(base,c,remote);mg.updatedAt=Date.now();syncInto(c,mg);
      if(id===S.cur){if(!document.activeElement?.closest?.('#root'))renderAll();else renderClientSelect();}
    }
    const {error}=await S.sb.from('clients').upsert({id,nom:String(c.nom||''),data:c,updated_at:new Date(c.updatedAt||Date.now()).toISOString()});
    if(error){failed=true;S.dirty.add(id);}else S.base[id]=clone(c);
  }
  S.saving=false;saveCache();
  S.online=!failed;
  if(failed){statusIdle();setTimeout(flush,5000);return;}
  if(S.again||S.dirty.size){S.again=false;flush();}else statusIdle();
}
async function loadAll(){
  const {data,error}=await S.sb.from('clients').select('id,data');
  if(error){S.online=false;statusIdle();return false;}
  S.online=true;
  const m={};
  data.forEach(r=>{const local=S.clients[r.id];
    if(S.dirty.has(r.id)&&local){m[r.id]=local;if(!S.base[r.id])S.base[r.id]=clone(r.data);}
    else if(local&&(local.updatedAt||0)>(r.data.updatedAt||0)){m[r.id]=local;S.base[r.id]=clone(r.data);S.dirty.add(r.id);}
    else{m[r.id]=local?syncInto(local,r.data):r.data;S.base[r.id]=clone(r.data);}});
  // local-only dossiers not yet saved (created offline)
  Object.keys(S.clients).forEach(id=>{if(!m[id]&&S.dirty.has(id))m[id]=S.clients[id];});
  S.clients=m;saveCache();
  if(S.dirty.size)flush();else statusIdle();
  return true;
}
function afterRemote(id){
  saveCache();
  if(!S.clients[S.cur]){pickDefault();renderAll();}
  else if(id===S.cur&&!document.activeElement?.closest?.('#root'))renderAll();
  else renderClientSelect();
}
function subscribe(){
  if(S.chan)S.sb.removeChannel(S.chan);
  S.chan=S.sb.channel('clients-'+S.user.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'clients',filter:'user_id=eq.'+S.user.id},p=>{
      if(p.eventType==='DELETE'){const id=p.old&&p.old.id;if(id&&S.clients[id]&&!S.dirty.has(id)){delete S.clients[id];afterRemote(id);}return;}
      const r=p.new;if(!r||!r.data)return;
      const local=S.clients[r.id];
      if(S.dirty.has(r.id)||(local&&(local.updatedAt||0)>=(r.data.updatedAt||0)))return;
      if(local)syncInto(local,r.data);else S.clients[r.id]=clone(r.data);S.base[r.id]=clone(r.data);afterRemote(r.id);
    }).subscribe();
}

      else if(k==='fin'){if(num===1)c.fin1=numv(t.value);else c.fin2=numv(t.value);}
    }
    // keep the couple labels right
    if(n==='prof'){const l=card.querySelectorAll('.person .top .lbl');if(l[0])l[0].textContent=c.profil==='couple'?'Personne 1':'Client';}
    updateAgeHints(c);touch();refreshDerived();
  });
}

function renderLeverResults(c,ctx){

      const sel=!L.custom&&t&&t.projet===r[0]&&+L.duree===d,dis=!ok(r,d);
      return `<td><button type="button" class="optc${sel?' sel':''}" data-d="${d}" data-p="${r[0]}" aria-pressed="${sel}" ${dis&&!sel?'disabled':''}><b>${r[k]} €/m</b><span>→ ${fE.format(r[k+1])} €/m</span></button></td>`;};
    box.innerHTML=hero+`
      <section class="kpis">
        <div class="kpi"><span class="k">Montant du projet</span><span class="v">${t?eur(t.projet):'—'}</span><span class="s">capital hors plus-value</span></div>
        <div class="kpi"><span class="k">Apport</span><span class="v">${t?eur(t.apport):'—'}</span><span class="s">10 % du projet</span></div>

      <div class="big"><span class="n">${fE.format(Math.round(+L.revenu||0))} €</span><span class="u">/ mois à partir de ${esc(L.debutAge)} ans</span></div>
      <p class="thesis">Effort de ${eurm(L.mensuel)}${+L.capital>0?` et ${eur(L.capital)} d'apport`:''}, pour un capital de ${eur(L.capRetraite)} à ${esc(c.retraite)} ans.</p></section>

  if(fisc&&res.paid>0){const netAvg=(res.T.rach-taxTot)/res.paid;const fr=res.rows.find(r=>r.rach>0);const i=res.rows.indexOf(fr);const mo=Math.max(1,Math.round(fr.rach/W));
    net=`Soit <b>${eur((fr.rach-taxes[i].tot)/mo)} net</b> la première année, <b>${eur(netAvg)} net</b> en moyenne.`;}

function perCardHTML(c,L){
  const annual=perAnnual(L);const r=perFiscal(c,annual);
  if(!r)return `<section class="card taxcard"><div class="card-h"><h3>Économie d'impôt</h3></div><p class="msg" style="margin:0">Renseignez le revenu net imposable et le nombre de parts (bloc « Économie d'impôt » à gauche) pour voir l'intérêt fiscal du PER.</p></section>`;
  const lvl=r.tmi>=.30?['ok','Intéressant']:r.tmi>0?['warn','Peu intéressant']:['err','Inutile : pas d\'impôt'];
  const men=Math.round(annual/12);
  const why=r.tmi>=.30?`Chaque euro versé jusqu'à ${eur(r.utile)} par an fait économiser ${Math.round(r.tmi*100)} %.`:r.tmi>0?'Le client est dans la tranche à 11 % : l\'économie est faible et l\'argent reste bloqué jusqu\'à la retraite.':'Le client ne paie pas d\'impôt : le versement ne lui fait rien économiser.';
  return `<section class="card taxcard"><div class="card-h"><h3>Économie d'impôt</h3><span class="pill-${lvl[0]}">TMI ${Math.round(r.tmi*100)} % · ${lvl[1]}</span></div>
    <p class="msg" style="margin:0 0 12px">${why}</p>
    <div class="taxgrid">
      <div><span class="k">Versé sur le PER</span><span class="v">${eur(annual)} / an</span><span class="s">${L.mv!=='capital'?eurm(men):''}${L.mv==='both'&&+L.capital>0?' + versement initial':''}</span></div>
      <div><span class="k">Impôt sans / avec PER</span><span class="v">${eur(r.avant)} → ${eur(r.apres)}</span><span class="s">barème 2026</span></div>
      <div class="hl"><span class="k">Économie d'impôt</span><span class="v">${eur(r.eco)}${L.mv!=='mensuel'&&+L.capital>0?'':' / an'}</span><span class="s">${L.mv!=='mensuel'&&+L.capital>0?'la 1re année':'chaque année'}</span></div>
      <div><span class="k">Effort réel</span><span class="v">${L.mv==='capital'?eur(annual-r.eco):eurm((annual-r.eco)/12)}</span><span class="s">versement − économie</span></div>
    </div>
    ${r.over?`<div class="alert warn" style="margin-top:12px"><span class="dot"></span><span>Le versement dépasse le plafond PER disponible (${eur(r.plaf)}) : l'excédent n'est pas déductible.</span></div>`:''}
    ${r.utile>0?`<div class="advice"><div><b>Montant conseillé : ${eur(r.conseil)} / an</b>, soit ${eurm(r.conseil/12)}<span class="s">le plus petit entre la tranche à 30 % et plus (${eur(r.utile)})${r.plaf?`, le plafond (${eur(r.plaf)}${r.plafPro?`, dont ${eur(r.plafPro)} côté pro`:''})`:''}${+c.capacite>0?` et la capacité d'épargne (${eur(+c.capacite*12)})`:''}</span></div>
      <button type="button" class="btn primary" id="perApply">Appliquer ${eurm(Math.floor(r.conseil/12))}</button></div>`:''}
  </section>`;
}
function yearTable(res,taxes,fisc,ctx){
  const head=['Âge'+(ctx.couple?' (P1 / P2)':''),'Phase','Versements','Frais versements','Intérêts','Frais gestion','Rachats bruts','dont plus-values',...(fisc?['Fiscalité','Net perçu']:[]),'Encours fin'];
  let rows='';
  res.rows.forEach((r,i)=>{
    const g=r.gains8+r.gainsPre,tx=taxes[i].tot;
    const vals=[ctx.couple?`${r.age} / ${r.age2}`:`${r.age} ans`,r.phase==='e'?'Épargne':r.phase==='r'?'Rachats':'Retraite',r.vers,r.feeV,r.int,r.feeG,r.rach,g,...(fisc?[tx,r.rach-tx]:[]),r.E];
    rows+=`<tr class="r-${r.phase}">`+vals.map((v,j)=>{if(j<2)return `<td>${v}</td>`;const neg=(j===3||j===5||(fisc&&j===8))&&v>0.5;return `<td class="${neg?'neg':''}${j===vals.length-1?' strong':''}">${Math.abs(v)>0.5?(neg?'−':'')+eur(v):'—'}</td>`;}).join('')+'</tr>';
  });
  return `<thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>`;
}

/* ================= chart ================= */
function niceMax(v){if(v<=0)return 1000;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return [1,1.2,1.5,2,2.5,3,4,5,6,8,10].find(t=>f<=t)*e;}
function drawChart(){
  const box=$('chart');if(!box||!S.chartData)return;
  const {res,res0,ctx,ret}=S.chartData;
  const Wd=Math.max(280,box.clientWidth),H=Wd<520?250:300;
  const m={l:Wd<520?44:58,r:14,t:26,b:30};
  const ks=[];for(let k=0;k<=ctx.N;k+=12)ks.push(k);if(!ks.includes(ctx.Ne))ks.push(ctx.Ne);if(!ks.includes(ctx.N))ks.push(ctx.N);ks.sort((a,b)=>a-b);
  const pts=ks.map(k=>({k,age:(ctx.a1+k)/12,E:res.Earr[k],E0:res0.Earr[k],v:res.Varr[k]}));
  const x0=ctx.a1/12,x1=(ctx.a1+ctx.N)/12,xr=(ctx.a1+ctx.Ne)/12;
  const yMax=niceMax(Math.max(...pts.map(q=>Math.max(q.E,q.E0,q.v)))*1.04);
  const X=a=>m.l+(a-x0)/(x1-x0)*(Wd-m.l-m.r),Y=v=>H-m.b-v/yMax*(H-m.t-m.b);
  let g='';
  for(let i=0;i<=4;i++){const v=i*yMax/4,yy=Y(v);g+=`<line class="grid-l" x1="${m.l}" x2="${Wd-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${kEur(v)}</text>`;}
  const span=x1-x0,xs=span>40?10:5,rx=X(xr);
  for(let a=Math.ceil(x0/xs)*xs;a<=x1+1e-9;a+=xs){if(Math.abs(X(a)-rx)<28)continue;g+=`<text x="${X(a)}" y="${H-m.b+18}" text-anchor="middle">${a} ans</text>`;}
  g+=`<text class="rettick" x="${rx}" y="${H-m.b+18}" text-anchor="middle">${ret} ans</text>`;
  const pe=pts.filter(q=>q.k<=ctx.Ne),pr=pts.filter(q=>q.k>=ctx.Ne);
  const line=(arr,f)=>arr.map((q,i)=>(i?'L':'M')+X(q.age).toFixed(1)+' '+Y(q[f]).toFixed(1)).join('');
  const area=arr=>arr.length?line(arr,'E')+`L${X(arr[arr.length-1].age).toFixed(1)} ${Y(0)}L${X(arr[0].age).toFixed(1)} ${Y(0)}Z`:'';
  g+=`<path class="a-e" d="${area(pe)}"/><path class="a-r" d="${area(pr)}"/><path class="l-v" d="${line(pts,'v')}"/><path class="l-z" d="${line(pts,'E0')}"/><path class="l-e" d="${line(pe,'E')}"/><path class="l-r" d="${line(pr,'E')}"/>`;
  g+=`<line class="retl" x1="${rx}" x2="${rx}" y1="${m.t-14}" y2="${H-m.b}"/>`;
  const anc=rx>Wd-150?'end':'start',dx=anc==='end'?-6:6;
  g+=`<text class="retlab" x="${rx+dx}" y="${m.t-4}" text-anchor="${anc}">Retraite · ${ret} ans · ${kEur(res.capR)}</text><circle cx="${rx}" cy="${Y(res.capR)}" r="4" fill="var(--teal)" stroke="var(--surface)" stroke-width="2"/>`;
  g+=`<line id="hv" class="hov" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" visibility="hidden"/><circle id="hc" r="4" fill="var(--ink)" visibility="hidden"/><rect id="ov" x="${m.l}" y="${m.t}" width="${Wd-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent"/>`;
  box.innerHTML=`<svg width="${Wd}" height="${H}" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Évolution de l'encours selon l'âge">${g}</svg><div class="tip" id="tip" hidden></div>`;
  const ov=box.querySelector('#ov'),tip=box.querySelector('#tip'),hv=box.querySelector('#hv'),hc=box.querySelector('#hc');
  function move(ev){
    const r=box.getBoundingClientRect(),cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    const a=x0+(cx-m.l)/(Wd-m.l-m.r)*(x1-x0);let q=pts[0],d=1e9;pts.forEach(p=>{const dd=Math.abs(p.age-a);if(dd<d){d=dd;q=p;}});
    const px=X(q.age),py=Y(q.E);
    hv.setAttribute('x1',px);hv.setAttribute('x2',px);hv.setAttribute('visibility','visible');hc.setAttribute('cx',px);hc.setAttribute('cy',py);hc.setAttribute('visibility','visible');
    const agl=ageTxtM(ctx.a1+q.k)+(ctx.couple?` / ${ageTxtM(ctx.a2+q.k)}`:'');
    tip.innerHTML=`<b>${agl}</b><br>Encours : <b>${eur(q.E)}</b><br>Sans frais : ${eur(q.E0)}<br>Cumul versé : ${eur(q.v)}`;
    tip.hidden=false;const tw=tip.offsetWidth;tip.style.left=Math.max(tw/2+2,Math.min(Wd-tw/2-2,px))+'px';tip.style.top=Math.max(tip.offsetHeight+4,py-10)+'px';
  }
  function out(){tip.hidden=true;hv.setAttribute('visibility','hidden');hc.setAttribute('visibility','hidden');}
  ov.addEventListener('mousemove',move);ov.addEventListener('touchstart',move,{passive:true});ov.addEventListener('touchmove',move,{passive:true});ov.addEventListener('mouseleave',out);ov.addEventListener('touchend',out);
}

/* ================= tab: solution chiffrée ================= */
function chiffreeData(c,ctx){
  const lines=c.levers.map(L=>{const o=leverOut(L,ctx);
    let sub='';if(L.kind==='scpi'&&o.scpi){sub=`(Effort ${eurm(o.mensuel)} + ${eur(o.capital)} apport, crédit ${L.duree} ans)`;}
    else if(L.kind==='manuel'){sub=L.sub&&L.sub.trim()?L.sub.trim():((+L.mensuel>0||+L.capital>0)?`(Effort ${[+L.mensuel>0?eurm(L.mensuel):'',+L.capital>0?eur(L.capital)+' apport':''].filter(Boolean).join(' + ')})`:'');}
    const vers=L.kind==='scpi'?(o.capital>0?eur(o.capital):'/'):L.kind==='manuel'?(+L.capital>0?eur(L.capital):(+L.mensuel>0?eurm(L.mensuel):'/')):versText(o);
    const dA=L.kind==='scpi'?o.debutAge:(L.kind==='manuel'?+L.debutAge:0);
    const revSub=dA&&dA!==+c.retraite?`à partir de ${dA} ans`:'';
    const kind=o.capital>0&&o.mensuel>0?'mix':o.capital>0?'cap':'men';
    return {label:leverLabel(L),sub,vers,capR:o.capR,W:o.W,revSub,kind,o,L};});
  const kinds=new Set(lines.map(l=>l.kind));
  let tv='/';if(kinds.size===1){if(kinds.has('cap'))tv=eur(lines.reduce((a,l)=>a+l.o.capital,0));else if(kinds.has('men'))tv=eurm(lines.reduce((a,l)=>a+l.o.mensuel,0));}
  return {lines,totVers:tv,totCap:lines.reduce((a,l)=>a+l.capR,0),totW:lines.reduce((a,l)=>a+l.W,0)};
}
function argsLines(c,totW){const pe=perEcoTotal(c);return [`Revenus à la retraite à hauteur de ${eurm(totW)}`,...(pe?[`Économie d'impôt de ${eur(pe.eco)}${pe.firstYear?' la 1re année':' par an'} grâce au PER, réinvestie sur le PER`]:[]),...String(c.args??DEF_ARGS).split('\n').map(s=>s.trim()).filter(Boolean)];}
function renderChiffree(c,ctx,body){

  renderMatrix(c,ctx);renderTriOutput(c,ctx);
}
function renderMatrix(c,ctx){
  const el=$('mx');if(!el)return;
  if(!c.levers.length){el.innerHTML='<p class="msg">Aucun levier.</p>';return;}
  const rows=triRows(c);
  el.innerHTML=`<table class="mx"><thead><tr><th>Levier</th><th>Solution 1</th><th>Solution 2</th><th>Solution 3</th></tr></thead><tbody>${c.levers.map(L=>`<tr><td class="lv">${esc(leverLabel(L))}</td>${[0,1,2].map(s=>{const it=rows[s][L.id];
      const inputs=L.kind==='sim'?`${L.mv!=='capital'?`<div class="inp"><input data-s="${s}" data-l="${L.id}" data-f="mensuel" id="mx-${s}-${L.id}-m" type="text" inputmode="decimal" value="${Math.round(it.mensuel)}"><span class="u">€/mois</span></div>`:''}${L.mv!=='mensuel'?`<div class="inp"><input data-s="${s}" data-l="${L.id}" data-f="capital" id="mx-${s}-${L.id}-c" type="text" inputmode="decimal" value="${Math.round(it.capital)}"><span class="u">€</span></div>`:''}`:`<span class="rv">${esc(versText({mensuel:+L.mensuel,capital:+L.capital}))}</span>`;
      return `<td><div class="cell"><label class="switch"><input type="checkbox" data-s="${s}" data-l="${L.id}" data-f="on" id="mx-${s}-${L.id}-on" ${it.on?'checked':''}> Inclus</label>${inputs}<span class="rv" id="rv-${s}-${L.id}"></span></div></td>`;}).join('')}</tr>`).join('')}</tbody></table>`;
  el.oninput=e=>{
    const t=e.target;if(!t.dataset.s)return;
    const T=c.tript;if(T.auto||!T.rows){T.rows=triRows(c);T.auto=false;}
    const r=T.rows[+t.dataset.s];const it=r[t.dataset.l]||(r[t.dataset.l]={on:false,mensuel:0,capital:0});
    if(t.dataset.f==='on')it.on=t.checked;else{it[t.dataset.f]=numv(t.value);it.on=true;const cb=$(`mx-${t.dataset.s}-${t.dataset.l}-on`);if(cb)cb.checked=true;}
    touch();renderTriOutput(c,ctxOf(c));
  };
}
function renderTriOutput(c,ctx){
  const el=$('triSlide');if(!el)return;
  const tm=$('triMode');if(tm)tm.textContent=c.tript.auto?'Proposition automatique':'Solutions ajustées à la main';
  if(ctx.errs.length){el.innerHTML=`<div class="alert err"><span class="dot"></span><span>${esc(ctx.errs.join(' '))}</span></div>`;return;}
  const tr=triCompute(c,ctx);
  el.innerHTML=`<h2>Trois solutions</h2><div class="stw"><table class="st tri"><thead><tr><th></th><th>Capacité d'épargne mensuelle</th><th>Capital</th><th>Revenus complémentaires à la retraite</th></tr></thead><tbody>
    ${tr.map((r,i)=>`<tr><td class="idx">${i+1}</td><td>${r.mensuel>0?eurm(r.mensuel):'/'}</td><td>${r.capital>0?eur(r.capital):'/'}</td><td>${eurm(r.W)}</td></tr>`).join('')}</tbody></table></div>`;
  tr.forEach((r,s)=>c.levers.forEach(L=>{const sp=$(`rv-${s}-${L.id}`);if(sp){const o=r.cells[L.id];sp.textContent=o?`→ ${eurm(o.W)}`:'';}}));
}

/* ================= Excel export ================= */
function loadExcel(){
  if(window.ExcelJS)return Promise.resolve();
  return new Promise((ok,ko)=>{const s=document.createElement('script');s.src='vendor/exceljs.min.js';s.onload=()=>ok();s.onerror=()=>ko(new Error('load'));document.head.appendChild(s);});
}
function sheetName(s,used){let n=String(s).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,28).trim()||'Feuille';let x=n,i=2;while(used.has(x.toLowerCase()))x=n.slice(0,25)+' '+(i++);used.add(x.toLowerCase());return x;}
async function exportXlsx(msgEl){
  const c=cur();if(!c)return;const ctx=ctxOf(c);
  const say=t=>{if(msgEl)msgEl.textContent=t;};
  if(ctx.errs.length){say('Corrigez d\'abord le profil du client.');return;}
  say('Préparation…');
  try{await loadExcel();}catch(e){say('Impossible de charger le module Excel.');return;}
  const X=window.ExcelJS,wb=new X.Workbook();wb.creator='Simulateur Assurance Vie';
  const NAVY='FF0E1A5C',G1='FFDDE3EB',G2='FFCAD2DD',GT='FFE8ECF1',WHITE='FFFFFFFF';
  const thin={style:'thin',color:{argb:WHITE}};const border={top:thin,left:thin,bottom:thin,right:thin};
  const fmtE='#,##0 "€"',fmtM='#,##0 "€/mois"';
  const used=new Set();
  const hdr=(ws,r)=>{ws.getRow(r).eachCell(cl=>{cl.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};cl.font={bold:true,color:{argb:WHITE},size:12};cl.alignment={horizontal:'center',vertical:'middle',wrapText:true};cl.border=border;});ws.getRow(r).height=42;};
  const body=(ws,r,fill,bold)=>{ws.getRow(r).eachCell({includeEmpty:true},cl=>{cl.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}};cl.alignment={horizontal:'center',vertical:'middle',wrapText:true};cl.border=border;cl.font={size:12,bold:!!bold};});};
  const title=(ws,t,cols)=>{ws.mergeCells(1,1,1,cols);const cl=ws.getCell(1,1);cl.value=t;cl.font={size:18,color:{argb:NAVY}};cl.alignment={horizontal:'center'};ws.getRow(1).height=30;};

  // 1. Solution chiffrée
  const d=chiffreeData(c,ctx);
  const w1=wb.addWorksheet(sheetName('Solution chiffrée',used));
  w1.columns=[{width:38},{width:26},{width:20},{width:30}];
  title(w1,`Notre solution chiffrée — ${c.nom}`,4);
  w1.getRow(3).values=['Leviers','Versements',`Capital à ${c.retraite} ans`,'Revenus complémentaires à la retraite'];hdr(w1,3);
  let r=4;
  d.lines.forEach((l,i)=>{
    const row=w1.getRow(r);
    row.values=[l.label+(l.sub?'\n'+l.sub:''),l.kind==='cap'&&l.L.kind==='sim'?l.o.capital:(l.kind==='men'&&l.L.kind==='sim'?l.o.mensuel:l.vers),Math.round(l.capR),l.revSub?`${eurm(l.W)}\n${l.revSub}`:Math.round(l.W)];
    body(w1,r,i%2?G1:G2);
    if(typeof row.getCell(2).value==='number')row.getCell(2).numFmt=l.kind==='cap'?fmtE:fmtM;
    row.getCell(3).numFmt=fmtE;if(typeof row.getCell(4).value==='number')row.getCell(4).numFmt=fmtM;
    row.height=l.sub||l.revSub?40:26;r++;
  });
  w1.getRow(r).values=['TOTAL',d.totVers,Math.round(d.totCap),Math.round(d.totW)];body(w1,r,GT,true);w1.getRow(r).getCell(3).numFmt=fmtE;w1.getRow(r).getCell(4).numFmt=fmtM;w1.getRow(r).height=26;
  r+=2;
  argsLines(c,d.totW).forEach(s=>{w1.mergeCells(r,1,r,4);const cl=w1.getCell(r,1);cl.value='•  '+s;cl.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}};cl.font={color:{argb:WHITE},size:12};cl.alignment={horizontal:'center',vertical:'middle',wrapText:true};w1.getRow(r).height=22;r++;});

  // 2. Trois solutions
  const tr=triCompute(c,ctx);
  const w2=wb.addWorksheet(sheetName('Trois solutions',used));
  w2.columns=[{width:8},{width:30},{width:22},{width:34}];
  title(w2,`Trois solutions — ${c.nom}`,4);
  w2.getRow(3).values=['','Capacité d\'épargne mensuelle','Capital','Revenus complémentaires à la retraite'];hdr(w2,3);
  tr.forEach((t,i)=>{const row=w2.getRow(4+i);row.values=[i+1,t.mensuel>0?Math.round(t.mensuel):'/',t.capital>0?Math.round(t.capital):'/',Math.round(t.W)];body(w2,4+i,i%2?G1:G2);
    row.getCell(1).font={bold:true,size:20,color:{argb:NAVY}};if(t.mensuel>0)row.getCell(2).numFmt=fmtM;if(t.capital>0)row.getCell(3).numFmt=fmtE;row.getCell(4).numFmt=fmtM;
    [2,3,4].forEach(k=>row.getCell(k).font={size:16});row.height=40;});
  let rr=8;w2.getCell(rr,2).value='Détail des solutions';w2.getCell(rr,2).font={bold:true};rr++;
  tr.forEach((t,i)=>{c.levers.forEach(L=>{const o=t.cells[L.id];if(!o)return;w2.getCell(rr,1).value=i+1;w2.getCell(rr,2).value=leverLabel(L);w2.getCell(rr,3).value=versText(o);w2.getCell(rr,4).value=Math.round(o.W);w2.getCell(rr,4).numFmt=fmtM;rr++;});});

  // 3. Hypothèses + détail par levier
  const w3=wb.addWorksheet(sheetName('Hypothèses',used));w3.columns=[{width:36},{width:30}];
  const kv=(k,v)=>{const row=w3.addRow([k,v]);row.getCell(1).font={bold:true};};
  w3.addRow([`Hypothèses — ${c.nom}`]).getCell(1).font={bold:true,size:14,color:{argb:NAVY}};w3.addRow([]);
  kv('Profil',c.profil==='couple'?'Couple':'Personne seule');
  kv('Âge (personne 1)',ageTxtM(ctx.a1));if(ctx.couple)kv('Âge (conjoint)',ageTxtM(ctx.a2));
  kv('Retraite à',`${c.retraite} ans`);kv('Rachats jusqu\'à',ageTxtM(ctx.endAgeM));
  kv('Date de l\'étude',new Date().toLocaleDateString('fr-FR'));w3.addRow([]);
  c.levers.forEach(L=>{
    w3.addRow([leverLabel(L)]).getCell(1).font={bold:true,color:{argb:NAVY}};
    if(L.kind==='scpi'){const o=leverOut(L,ctx);kv('Durée du crédit',`${L.duree} ans`);kv('Montant du projet',eur(o.capR));kv('Apport',eur(o.capital));kv('Participation',eurm(o.mensuel));kv('Revenus',`${eurm(o.W)} à partir de ${o.debutAge} ans`);}
    else if(L.kind==='manuel'){kv('Effort mensuel',eurm(L.mensuel));kv('Apport',eur(L.capital));kv(`Capital à ${c.retraite} ans`,eur(L.capRetraite));kv('Revenu',`${eurm(L.revenu)} à partir de ${L.debutAge} ans`);}
    else{const o=leverOut(L,ctx);kv('Versements',versText(o)+(L.idxOn?` (indexés +${pct(L.idx,1)}/an)`:''));kv('Rendement',`${pct(L.r)} ${L.rt}`);kv('Frais de gestion',`${pct(L.fg)} / an`);kv('Frais sur versements',pct(L.fv));kv('Rachats',L.mr==='fixe'?`Montant choisi : ${eurm(L.fixe)}`:'Épuisement du capital à l\'horizon');kv(`Capital à ${c.retraite} ans`,eur(o.capR));kv('Revenu complémentaire (brut)',eurm(o.W));}
    w3.addRow([]);
  });
  c.levers.filter(L=>L.kind==='sim').forEach(L=>{
    const res=simulate(L,ctx,{W:L.mr==='fixe'?(+L.fixe||0):null});const fisc=L.fisc&&L.produit!=='PER';const taxes=res.rows.map(x=>taxRow(x,L,ctx));
    const ws=wb.addWorksheet(sheetName(leverLabel(L),used));
    const head=['Âge','Phase','Versements','Frais versements','Intérêts','Frais gestion','Rachats bruts','dont plus-values',...(fisc?['Fiscalité','Net perçu']:[]),'Encours fin'];
    ws.columns=head.map((h,i)=>({width:i<2?12:16}));ws.getRow(1).values=head;hdr(ws,1);
    res.rows.forEach((x,i)=>{const tx=taxes[i].tot;const row=ws.addRow([ctx.couple?`${x.age} / ${x.age2}`:x.age,x.phase==='e'?'Épargne':x.phase==='r'?'Rachats':'Retraite',x.vers,x.feeV,x.int,x.feeG,x.rach,x.gains8+x.gainsPre,...(fisc?[tx,x.rach-tx]:[]),x.E].map((v,j)=>j>=2?Math.round(v):v));
      for(let j=3;j<=head.length;j++)row.getCell(j).numFmt=fmtE;});
    ws.views=[{state:'frozen',ySplit:1}];
  });

  try{
    const buf=await wb.xlsx.writeBuffer();
    const fn=`Etude ${String(c.nom).replace(/[\\\/:*?"<>|]/g,' ').trim()||'client'} ${new Date().toISOString().slice(0,10)}.xlsx`;
    saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fn);
    say('Fichier téléchargé.');setTimeout(()=>say(''),3000);
  }catch(e){
    const code=e&&e.code;say('Téléchargement impossible.');
  }
}

/* ================= client actions ================= */
function addClient(c){S.clients[c.id]=c;S.cur=c.id;S.lever=c.levers[0]?.id||null;S.tab='leviers';S.dirty.add(c.id);saveCache();setStatus('busy','Enregistrement…');flush();renderAll();}
function openClient(id){S.cur=id;const c=cur();S.lever=c?.levers[0]?.id||null;renderAll();}
$('clientSel').onchange=e=>openClient(e.target.value);

/* ---- client search ---- */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const sIn=$('cSearch'),sPop=$('cResults');let sHits=[],sAct=0;
function searchRender(){
  const q=norm(sIn.value).trim();
  if(!q){sPop.hidden=true;sIn.setAttribute('aria-expanded','false');return;}
  const words=q.split(/\s+/);
  sHits=Object.values(S.clients).filter(c=>{const n=norm(c.nom);return words.every(w=>n.includes(w));})
    .sort((a,b)=>(norm(a.nom).startsWith(words[0])?0:1)-(norm(b.nom).startsWith(words[0])?0:1)||String(a.nom).localeCompare(String(b.nom),'fr')).slice(0,30);
  sAct=Math.min(sAct,Math.max(0,sHits.length-1));
  const hl=name=>{let h=esc(name);const n=norm(name);const w=words[0];const i=n.indexOf(w);if(i>=0&&w)h=esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+w.length))+'</mark>'+esc(name.slice(i+w.length));return h;};
  sPop.innerHTML=sHits.length?sHits.map((c,i)=>`<button type="button" role="option" class="${i===sAct?'act':''}" data-id="${c.id}"><b>${hl(c.nom||'Sans nom')}</b><span>${c.levers.length} levier${c.levers.length>1?'s':''} · modifié le ${new Date(c.updatedAt||c.createdAt||Date.now()).toLocaleDateString('fr-FR')}</span></button>`).join(''):`<div class="none">Aucun client ne correspond à « ${esc(sIn.value)} ».</div>`;
  sPop.hidden=false;sIn.setAttribute('aria-expanded','true');
  sPop.querySelectorAll('button').forEach(b=>b.onmousedown=e=>{e.preventDefault();pickHit(b.dataset.id);});
}
function pickHit(id){if(!id)return;sIn.value='';sPop.hidden=true;sIn.setAttribute('aria-expanded','false');openClient(id);}
sIn.addEventListener('input',()=>{sAct=0;searchRender();});
sIn.addEventListener('focus',searchRender);
sIn.addEventListener('blur',()=>setTimeout(()=>{sPop.hidden=true;sIn.setAttribute('aria-expanded','false');},120));
sIn.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();sAct=Math.min(sHits.length-1,sAct+1);searchRender();}
  else if(e.key==='ArrowUp'){e.preventDefault();sAct=Math.max(0,sAct-1);searchRender();}
  else if(e.key==='Enter'){e.preventDefault();pickHit(sHits[sAct]?.id);}
  else if(e.key==='Escape'){sIn.value='';sPop.hidden=true;sIn.blur();}
});
$('newClient').onclick=()=>{addClient(newClient());setTimeout(()=>{const n=$('cNom');if(n){n.focus();n.select();}},0);};
$('dupClient').onclick=()=>{const c=cur();if(!c)return;const n=JSON.parse(JSON.stringify(c));n.id=uid();n.nom=(c.nom||'Client')+' (copie)';n.createdAt=n.updatedAt=Date.now();addClient(n);};
const delB=$('delClient');
delB.onclick=async()=>{
  const c=cur();if(!c)return;
  if(!delB.classList.contains('armed')){delB.classList.add('armed');delB.textContent='Confirmer la suppression';setTimeout(()=>{delB.classList.remove('armed');delB.textContent='Supprimer';},4000);return;}
  delB.classList.remove('armed');delB.textContent='Supprimer';
  const id=c.id;delete S.clients[id];S.dirty.delete(id);S.cur=null;pickDefault();renderAll();
  removeClient(id);
};
try{const t=localStorage.getItem('av-tab');if(t)S.tab=t;}catch(e){}
initStore();
})();
